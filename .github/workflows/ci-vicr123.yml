name: CI
on:
  push:
    branches: [ssh-vicr123]
    tags:
      - '[0-9]+.[0-9]+.[0-9]+'
      - '[0-9]+.[0-9]+.[0-9]+-*'
  pull_request:
  workflow_dispatch:
env:
  DOTNET_NOLOGO: true
jobs:
  build-native-linux-x64:
    name: Build Native Libraries (Linux x64)
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4.1.2
        with:
          fetch-depth: 0
          submodules: true
      - name: Build native libraries
        run: |
          docker build -f libgit2sharp-native/Dockerfile.linux-simple -t nativebuild .
          docker run --rm \
            -v ${{ github.workspace }}/libgit2sharp-native/build-output:/src/libgit2sharp-native/build-output \
            nativebuild linux-x64
      - name: Upload native artifacts
        uses: actions/upload-artifact@v4.3.1
        with:
          name: native-linux-x64
          path: libgit2sharp-native/build-output/linux-x64

  build-native-linux-arm64:
    name: Build Native Libraries (Linux ARM64)
    runs-on: ubuntu-22.04-arm
    steps:
      - name: Checkout
        uses: actions/checkout@v4.1.2
        with:
          fetch-depth: 0
          submodules: true
      - name: Build native libraries
        run: |
          docker build -f libgit2sharp-native/Dockerfile.linux-simple -t nativebuild .
          docker run --rm \
            -v ${{ github.workspace }}/libgit2sharp-native/build-output:/src/libgit2sharp-native/build-output \
            nativebuild linux-arm64
      - name: Upload native artifacts
        uses: actions/upload-artifact@v4.3.1
        with:
          name: native-linux-arm64
          path: libgit2sharp-native/build-output/linux-arm64

  build-native-linux-arm:
    name: Build Native Libraries (Linux ARM)
    runs-on: ubuntu-22.04-arm
    steps:
      - name: Checkout
        uses: actions/checkout@v4.1.2
        with:
          fetch-depth: 0
          submodules: true
      - name: Set up QEMU (for armv7)
        uses: docker/setup-qemu-action@v3
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build native libraries
        run: |
          docker buildx build \
            --platform linux/arm/v7 \
            -f libgit2sharp-native/Dockerfile.linux-simple \
            --load \
            -t nativebuild .
          docker run --rm --platform linux/arm/v7 \
            -v ${{ github.workspace }}/libgit2sharp-native/build-output:/src/libgit2sharp-native/build-output \
            nativebuild linux-arm
      - name: Upload native artifacts
        uses: actions/upload-artifact@v4.3.1
        with:
          name: native-linux-arm
          path: libgit2sharp-native/build-output/linux-arm

  build-native-linux-musl-x64:
    name: Build Native Libraries (Linux musl x64)
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4.1.2
        with:
          fetch-depth: 0
          submodules: true
      - name: Build native libraries
        run: |
          docker build -f libgit2sharp-native/Dockerfile.alpine -t nativebuild-musl .
          docker run --rm \
            -v ${{ github.workspace }}/libgit2sharp-native/build-output:/src/libgit2sharp-native/build-output \
            nativebuild-musl linux-musl-x64
      - name: Upload native artifacts
        uses: actions/upload-artifact@v4.3.1
        with:
          name: native-linux-musl-x64
          path: libgit2sharp-native/build-output/linux-musl-x64
  build-native-linux-musl-arm64:
    name: Build Native Libraries (Linux musl ARM64)
    runs-on: ubuntu-22.04-arm
    steps:
      - name: Checkout
        uses: actions/checkout@v4.1.2
        with:
          fetch-depth: 0
          submodules: true
      - name: Build native libraries
        run: |
          docker build -f libgit2sharp-native/Dockerfile.alpine -t nativebuild-musl .
          docker run --rm \
            -v ${{ github.workspace }}/libgit2sharp-native/build-output:/src/libgit2sharp-native/build-output \
            nativebuild-musl linux-musl-arm64
      - name: Upload native artifacts
        uses: actions/upload-artifact@v4.3.1
        with:
          name: native-linux-musl-arm64
          path: libgit2sharp-native/build-output/linux-musl-arm64

  build-native-windows:
    name: Build Native Libraries (Windows)
    runs-on: windows-latest
    strategy:
      matrix:
        rid: [win-x64, win-x86, win-arm64]
    steps:
      - name: Checkout
        uses: actions/checkout@v4.1.2
        with:
          fetch-depth: 0
          submodules: true
      - name: Build native libraries (${{ matrix.rid }})
        shell: pwsh
        run: ./libgit2sharp-native/build-native.ps1 ${{ matrix.rid }}
      - name: Upload native artifacts
        uses: actions/upload-artifact@v4.3.1
        with:
          name: native-${{ matrix.rid }}
          path: libgit2sharp-native/build-output/${{ matrix.rid }}

  build-native-macos-arm64:
    name: Build Native Libraries (macOS ARM64)
    runs-on: macos-latest  # Apple Silicon runners
    steps:
      - name: Checkout
        uses: actions/checkout@v4.1.2
        with:
          fetch-depth: 0
          submodules: true
      - name: Build native libraries (osx-arm64)
        shell: pwsh
        run: ./libgit2sharp-native/build-native.ps1 osx-arm64
      - name: Upload native artifacts
        uses: actions/upload-artifact@v4.3.1
        with:
          name: native-osx-arm64
          path: libgit2sharp-native/build-output/osx-arm64
  build-native-macos-x64:
    name: Build Native Libraries (macOS x64)
    runs-on: macos-13  # Intel runners
    steps:
      - name: Checkout
        uses: actions/checkout@v4.1.2
        with:
          fetch-depth: 0
          submodules: true
      - name: Build native libraries (osx-x64)
        shell: pwsh
        run: ./libgit2sharp-native/build-native.ps1 osx-x64
      - name: Upload native artifacts
        uses: actions/upload-artifact@v4.3.1
        with:
          name: native-osx-x64
          path: libgit2sharp-native/build-output/osx-x64
  build-dotnet:
    name: Build and Pack .NET
    runs-on: ubuntu-22.04
    needs: [build-native-linux-x64, build-native-linux-arm64, build-native-linux-arm, build-native-linux-musl-x64, build-native-linux-musl-arm64, build-native-windows, build-native-macos-arm64, build-native-macos-x64]
    steps:
      - name: Checkout
        uses: actions/checkout@v4.1.2
        with:
          fetch-depth: 0
      - name: Install .NET SDK
        uses: actions/setup-dotnet@v4.0.0
        with:
          dotnet-version: 9.0.x
      - name: Download native artifacts
        uses: actions/download-artifact@v4
        with:
          path: libgit2sharp-native/build-output
      - name: Move native outputs to correct structure
        run: |
          for d in libgit2sharp-native/build-output/native-*; do
            rid=$(basename "$d" | sed 's/native-//')
            mkdir -p "libgit2sharp-native/build-output/$rid"
            mv "$d"/* "libgit2sharp-native/build-output/$rid/" || true
            rmdir "$d" || true
          done
      - name: Pack LibGit2Sharp
        run: dotnet pack LibGit2Sharp/LibGit2Sharp.csproj --configuration Release --output artifacts/package
      - name: Upload packages
        uses: actions/upload-artifact@v4.3.1
        with:
          name: NuGet packages
          path: artifacts/package/
          retention-days: 7
